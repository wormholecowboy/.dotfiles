<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ernie · Live Context</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Fragment+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    img, svg, pre { max-width: 100%; }

    :root {
      --sans: 'Bricolage Grotesque', system-ui, sans-serif;
      --mono: 'Fragment Mono', ui-monospace, SFMono-Regular, monospace;

      --bg: #0a1520; --bg-card: #0f1e2c; --bg-recessed: #0c1925; --bg-raised: #132638;
      --text: #d8e6f2; --text-dim: #8299ae; --text-accent: #7dd3fc;
      --accent: #38bdf8; --accent-soft: #0c2f48;
      --border: #1c3246; --border-accent: #1f5a82;
      --grid: rgba(56,189,248,.04);
      --success: #34d399; --warning: #fbbf24; --error: #f87171;
      --pass-bg: #064e3b; --pass-fg: #a7f3d0;
      --warn-bg: #78350f; --warn-fg: #fde68a;
      --info-bg: #1e3a8a; --info-fg: #dbeafe;
      --shadow: rgba(0,0,0,.5);
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f3f7fb; --bg-card: #ffffff; --bg-recessed: #eef3f8; --bg-raised: #ffffff;
        --text: #0d1f2e; --text-dim: #557087; --text-accent: #0369a1;
        --accent: #0284c7; --accent-soft: #e0f2fe;
        --border: #d3dfea; --border-accent: #7cc4ee;
        --grid: rgba(2,132,199,.05);
        --success: #059669; --warning: #b45309; --error: #dc2626;
        --pass-bg: #d1fae5; --pass-fg: #065f46;
        --warn-bg: #fef3c7; --warn-fg: #92400e;
        --info-bg: #dbeafe; --info-fg: #1e40af;
        --shadow: rgba(13,31,46,.16);
        color-scheme: light;
      }
    }
    :root[data-theme="light"] {
      --bg: #f3f7fb; --bg-card: #ffffff; --bg-recessed: #eef3f8; --bg-raised: #ffffff;
      --text: #0d1f2e; --text-dim: #557087; --text-accent: #0369a1;
      --accent: #0284c7; --accent-soft: #e0f2fe;
      --border: #d3dfea; --border-accent: #7cc4ee;
      --grid: rgba(2,132,199,.05);
      --success: #059669; --warning: #b45309; --error: #dc2626;
      --pass-bg: #d1fae5; --pass-fg: #065f46;
      --warn-bg: #fef3c7; --warn-fg: #92400e;
      --info-bg: #dbeafe; --info-fg: #1e40af;
      --shadow: rgba(13,31,46,.16);
      color-scheme: light;
    }

    body {
      margin: 0; font-family: var(--sans); font-size: 14px; line-height: 1.5;
      color: var(--text); background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 24px 24px; background-attachment: fixed;
    }
    code, .mono { font-family: var(--mono); font-size: .92em; }
    button { font: inherit; color: inherit; }

    .mock-banner { font: 11px var(--mono); text-align: center; padding: 6px 16px;
      background: var(--warn-bg); color: var(--warn-fg); letter-spacing: .05em; }

    /* Top bar */
    .topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px;
      flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); }
    .brand { font-weight: 800; font-size: 19px; letter-spacing: -.02em; }
    .brand span { color: var(--accent); }
    .log-picker { font: 12.5px var(--mono); color: var(--text); background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
    .status { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      font: 11.5px var(--mono); color: var(--text-dim); }
    .live { color: var(--success); display: inline-flex; align-items: center; gap: 6px; }
    .live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--success);
      animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    .icon-btn { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 10px; cursor: pointer; font: 11.5px var(--mono); }
    .icon-btn:hover { border-color: var(--accent); }

    /* Board */
    .board { display: grid; gap: 16px; padding: 16px 20px 150px; max-width: 1500px; margin: 0 auto;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.25fr) minmax(0, .9fr);
      grid-template-areas:
        "plan questions activity"
        "facts decisions activity"
        "diagrams diagrams activity"; }
    @media (max-width: 1100px) {
      .board { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-areas:
          "questions questions"
          "plan decisions"
          "diagrams diagrams"
          "facts activity"; }
    }
    @media (max-width: 720px) {
      .board { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 190px;
        grid-template-areas: "questions" "plan" "decisions" "diagrams" "facts" "activity"; }
      .topbar { padding: 10px 16px; }
      .status { margin-left: 0; }
    }
    .a-plan { grid-area: plan; } .a-questions { grid-area: questions; } .a-decisions { grid-area: decisions; }
    .a-facts { grid-area: facts; } .a-diagrams { grid-area: diagrams; } .a-activity { grid-area: activity; }

    .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      min-width: 0; display: flex; flex-direction: column; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 11px 14px; border-bottom: 1px solid var(--border);
      font: 11px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); }
    .panel-head .count { color: var(--text-accent); text-transform: none; letter-spacing: 0; }
    .panel-body { padding: 10px 14px 14px; min-width: 0; }
    .empty { color: var(--text-dim); font-size: 13px; padding: 8px 0; }
    .hint { font: 10.5px var(--mono); color: var(--text-dim); text-transform: none; letter-spacing: 0; }

    /* Plan */
    .progress { height: 4px; background: var(--bg-recessed); margin: 0; }
    .progress > i { display: block; height: 100%; background: var(--success); transition: width .3s; }
    .plan { list-style: none; margin: 0; padding: 0; }
    .plan li { position: relative; padding: 8px 0 8px 32px; border-bottom: 1px dashed var(--border); }
    .plan li:last-child { border-bottom: none; }
    .status-box { position: absolute; left: 0; top: 8px; width: 20px; height: 20px; border-radius: 5px;
      border: 1.5px solid var(--text-dim); background: transparent; cursor: pointer; padding: 0;
      font: 800 12px var(--sans); line-height: 17px; text-align: center; }
    .plan li.done { color: var(--text-dim); }
    .plan li.done .text { text-decoration: line-through; text-decoration-color: var(--border-accent); }
    .plan li.done .status-box { background: var(--success); border-color: var(--success); color: var(--bg); }
    .plan li.active .status-box { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); color: var(--accent); }
    .plan li.active .text { color: var(--text-accent); }
    .plan li.dropped { opacity: .5; }
    .item-id { font: 10.5px var(--mono); color: var(--text-dim); margin-right: 6px; }

    /* Questions */
    .q { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--bg-recessed); }
    .q:last-child { margin-bottom: 0; }
    .q.open { border-color: var(--border-accent); background: var(--accent-soft); }
    .q-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .q-num { font: 11px var(--mono); color: var(--accent); }
    .q-text { font-size: 15px; font-weight: 600; margin: 3px 0 10px; overflow-wrap: break-word; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .chip { font: 12px var(--mono); padding: 5px 11px; border-radius: 14px; border: 1px solid var(--border);
      background: var(--bg-card); cursor: pointer; }
    .chip:hover { border-color: var(--accent); }
    .q input, .note-input { width: 100%; font: 12.5px var(--mono); padding: 8px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg-card); color: var(--text); }
    .q input:focus, .note-input:focus { outline: none; border-color: var(--accent); }
    .q.answered .q-text { margin-bottom: 4px; font-weight: 400; color: var(--text-dim); font-size: 14px; }
    .answer { font: 12.5px var(--mono); color: var(--success); overflow-wrap: anywhere; }
    .link-btn { background: none; border: none; padding: 0; cursor: pointer; font: 11px var(--mono);
      color: var(--text-dim); text-decoration: underline; }
    .link-btn:hover { color: var(--accent); }

    /* Decisions & facts */
    .dec { padding: 8px 0 8px 12px; border-left: 2px solid var(--accent); margin: 6px 0 10px; }
    .dec b { font-weight: 600; display: block; overflow-wrap: break-word; }
    .dec .why { font-size: 13px; color: var(--text-dim); overflow-wrap: break-word; }
    .facts { list-style: none; margin: 0; padding: 0; }
    .facts li { position: relative; padding: 7px 28px 7px 0; border-bottom: 1px dashed var(--border); overflow-wrap: break-word; }
    .facts li:last-child { border-bottom: none; }
    .facts .dismiss { position: absolute; right: 0; top: 6px; width: 22px; height: 22px; border-radius: 5px;
      border: 1px solid transparent; background: none; cursor: pointer; color: var(--text-dim); }
    .facts .dismiss:hover { border-color: var(--border); color: var(--error); }

    /* Diagrams */
    .tabs { display: flex; gap: 4px; }
    .tab { font: 11px var(--mono); padding: 3px 10px; border-radius: 5px; border: 1px solid var(--border);
      background: var(--bg-recessed); cursor: pointer; text-transform: none; letter-spacing: 0; }
    .tab.selected { border-color: var(--accent); color: var(--text-accent); }
    .diagram { overflow: auto; padding: 16px; min-height: 220px; display: flex; justify-content: center; }
    .diagram .loading { font: 12px var(--mono); color: var(--text-dim); align-self: center; }
    .diagram .nodeLabel { color: var(--text) !important; }
    .diagram .edgeLabel { color: var(--text-dim) !important; background-color: var(--bg-card) !important; }
    .diagram .edgeLabel rect { fill: var(--bg-card) !important; }
    .diagram .edgeLabel p { background-color: var(--bg-card) !important; }

    /* Activity */
    .a-activity .panel-body { max-height: calc(100dvh - 200px); overflow-y: auto; }
    @media (max-width: 1100px) { .a-activity .panel-body { max-height: 420px; } }
    .feed { list-style: none; margin: 0; padding: 0; font: 12px var(--mono); }
    .feed li { padding: 5px 0; border-bottom: 1px solid var(--border); color: var(--text-dim); overflow-wrap: anywhere; }
    .feed li:last-child { border-bottom: none; }
    .feed .t { opacity: .7; margin-right: 6px; }
    .who { display: inline-block; min-width: 52px; }
    .who--hook { color: var(--warning); } .who--claude { color: var(--accent); } .who--you { color: var(--success); }
    .feed li.fresh { animation: flash 1.4s ease-out; }
    @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }

    /* Outbox */
    .outbox { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      background: var(--bg-raised); border-top: 1px solid var(--border-accent);
      box-shadow: 0 -20px 50px -30px var(--shadow); }
    .outbox-inner { max-width: 1500px; margin: 0 auto; padding: 10px 20px;
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
    @media (max-width: 720px) {
      .outbox-inner { grid-template-columns: minmax(0, 1fr); padding: 10px 16px; }
    }
    .outbox-state { font: 12px var(--mono); white-space: nowrap; }
    .outbox-state b { color: var(--warning); font-weight: 400; }
    .outbox-state.clear b { color: var(--success); }
    .outbox-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn { font: 12px var(--mono); padding: 7px 12px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg-card); }
    .btn:hover { border-color: var(--accent); }
    .btn--primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .btn:disabled { opacity: .45; cursor: default; }
    .preview { max-width: 1500px; margin: 0 auto; padding: 0 20px 12px; display: none; }
    .preview.open { display: block; }
    .preview pre { margin: 0; padding: 12px 14px; border-radius: 8px; background: var(--bg-recessed);
      border: 1px solid var(--border); font: 12px/1.7 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (max-width: 720px) { .preview { padding: 0 16px 12px; } }
  </style>
</head>
<body>
  <div class="mock-banner">MOCK · static sample state, no server · actions update local state and the outbox only</div>

  <header class="topbar">
    <div class="brand">ernie<span>.</span></div>
    <select class="log-picker" id="log-picker" aria-label="Log">
      <option>dotfiles / main</option>
      <option>dotfiles / feat-ernie-core</option>
      <option>work-repo / fix-auth-redirect</option>
    </select>
    <div class="status">
      <span class="live">live</span>
      <span id="turn">turn 12</span>
      <span id="updated">updated just now</span>
      <button class="icon-btn" id="theme-toggle" type="button">◐ theme</button>
    </div>
  </header>

  <main class="board">
    <section class="panel a-plan">
      <div class="panel-head"><span>Plan</span><span class="count" id="plan-count"></span></div>
      <div class="progress"><i id="plan-progress"></i></div>
      <div class="panel-body">
        <ul class="plan" id="plan"></ul>
      </div>
    </section>

    <section class="panel a-questions">
      <div class="panel-head"><span>Questions</span><span class="count" id="q-count"></span></div>
      <div class="panel-body" id="questions"></div>
    </section>

    <section class="panel a-decisions">
      <div class="panel-head"><span>Decisions</span><span class="count" id="d-count"></span></div>
      <div class="panel-body" id="decisions"></div>
    </section>

    <section class="panel a-facts">
      <div class="panel-head"><span>Facts</span><span class="hint">× to dismiss</span></div>
      <div class="panel-body"><ul class="facts" id="facts"></ul></div>
    </section>

    <section class="panel a-diagrams">
      <div class="panel-head"><span>Diagrams</span><div class="tabs" id="diagram-tabs"></div></div>
      <div class="diagram" id="diagram"><span class="loading">rendering…</span></div>
    </section>

    <section class="panel a-activity">
      <div class="panel-head"><span>Activity</span><span class="hint">newest first</span></div>
      <div class="panel-body"><ul class="feed" id="feed"></ul></div>
    </section>
  </main>

  <div class="outbox">
    <div class="preview" id="preview"><pre id="preview-text"></pre></div>
    <div class="outbox-inner">
      <div class="outbox-state" id="outbox-state"></div>
      <input class="note-input" id="note-input" type="text" placeholder="Note to Claude… (enter to queue)">
      <div class="outbox-actions">
        <button class="btn" id="preview-btn" type="button">preview</button>
        <button class="btn btn--primary" id="deliver-btn" type="button">simulate next prompt</button>
      </div>
    </div>
  </div>

  <!-- State rendering + interactions (the real page receives `state` over SSE and POSTs user events) -->
  <script>
    const state = {
      log: 'dotfiles/main',
      turn: 12,
      updatedAt: Date.now() - 4000,
      plan: [
        { id: 'p1', text: 'Pick event format', status: 'done' },
        { id: 'p2', text: 'Sketch architecture', status: 'done' },
        { id: 'p3', text: 'Write plan + mock', status: 'done' },
        { id: 'p4', text: 'Core: append, fold, dump', status: 'active' },
        { id: 'p5', text: 'Hooks + settings.json wiring', status: 'todo' },
        { id: 'p6', text: 'Server + embedded page', status: 'todo' },
        { id: 'p7', text: 'Adoption: skill, decisions.md', status: 'todo' },
      ],
      decisions: [
        { id: 'd1', text: 'JSONL over JSON', why: 'append-only; Claude never reads before writing' },
        { id: 'd2', text: 'Scope by repo + branch', why: 'survives /clear and new sessions' },
        { id: 'd3', text: 'Server-side fold', why: 'fold logic lives once, in Go; page only renders' },
      ],
      questions: [
        { id: 'q1', text: 'Want tests?', choices: ['yes', 'no'], answer: 'yes' },
        { id: 'q2', text: 'Go for the CLI, hooks and server?', choices: ['go', 'bash + jq', 'bun'], answer: 'go' },
        { id: 'q3', text: 'Where does the source live?', choices: ['dotfiles ernie/', '~/things/myc/ernie'], answer: 'dotfiles ernie/' },
        { id: 'q4', text: 'Name for the binary?', choices: [], answer: 'ernie' },
        { id: 'q5', text: 'Server lifecycle for v1?', choices: ['manual pane', 'launchd'], answer: 'manual pane' },
        { id: 'q6', text: 'Server folds state, page only renders?', choices: ['yes', 'no — fold in the page'], answer: 'yes' },
      ],
      facts: [
        { id: 'f1', text: 'Hooks exit 0 on any error — never break a session' },
        { id: 'f2', text: 'Server binds 127.0.0.1 only' },
        { id: 'f3', text: 'POST /events requires the per-server token' },
      ],
      activity: [
        { ts: '09:58', by: 'claude', text: 'p4 → active' },
        { ts: '09:57', by: 'hook', text: 'Write plans/live-context-ui/mock.html' },
        { ts: '09:55', by: 'hook', text: 'Write plans/live-context-ui/plan.md' },
        { ts: '09:54', by: 'claude', text: 'decided d3 Server-side fold' },
        { ts: '09:52', by: 'hook', text: 'Bash go build ./gohello ✓' },
        { ts: '09:50', by: 'you', text: 'answered q1 → yes' },
      ],
      diagrams: [
        { name: 'arch', mermaid: `flowchart TD
  C["Claude"] -->|"ernie plan · decide · ask"| CLI["ernie"]
  H["hooks"] -->|"files · cmds"| CLI
  CLI -->|append| LOG[("events.jsonl")]
  LOG -->|poll| SRV["ernie serve<br/>fold"]
  SRV -->|"SSE state"| UI["this page"]
  UI -->|"POST + token"| SRV
  LOG -->|"inbox on next prompt"| C` },
        { name: 'turn', mermaid: `sequenceDiagram
  actor You
  participant Page
  participant Log as events.jsonl
  participant Claude
  You->>Page: Answer q2
  Page->>Log: Append answer event
  You->>Claude: Next prompt
  Log->>Claude: Hook injects inbox
  Claude->>Log: ernie plan set p4 done
  Log-->>Page: SSE pushes new state` },
      ],
    };

    // Simulates POST /events; the real page sends these to the server
    const outbox = [];
    let selectedDiagram = 'arch';
    let previewOpen = false;

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const clock = () => new Date().toTimeString().slice(0, 5);
    const nextStatus = { todo: 'active', active: 'done', done: 'todo', dropped: 'todo' };
    const statusGlyph = { todo: '', active: '▶', done: '✓', dropped: '–' };

    function queueUserEvent(event, label) {
      outbox.push({ ...event, by: 'user', label });
      state.activity.unshift({ ts: clock(), by: 'you', text: label, fresh: true });
      state.updatedAt = Date.now();
      render();
    }

    function renderPlan() {
      const done = state.plan.filter(p => p.status === 'done').length;
      document.getElementById('plan-count').textContent = `${done}/${state.plan.length}`;
      document.getElementById('plan-progress').style.width = `${(done / state.plan.length) * 100}%`;
      document.getElementById('plan').innerHTML = state.plan.map(p => `
        <li class="${p.status}">
          <button class="status-box" type="button" data-plan="${p.id}" title="${p.status} — click to change">${statusGlyph[p.status]}</button>
          <span class="item-id">${p.id}</span><span class="text">${esc(p.text)}</span>
        </li>`).join('');
    }

    function renderQuestions() {
      const total = state.questions.length;
      const answered = state.questions.filter(q => q.answer).length;
      document.getElementById('q-count').textContent = `${answered}/${total} answered`;
      // Reason: open questions first so the thing needing you is always at the top
      const ordered = state.questions
        .map((q, index) => ({ ...q, index }))
        .sort((a, b) => Boolean(a.answer) - Boolean(b.answer) || a.index - b.index);
      document.getElementById('questions').innerHTML = ordered.map(q => {
        const num = `Q${q.index + 1}/${total}`;
        if (q.answer) {
          return `
            <div class="q answered">
              <div class="q-top"><span class="q-num">${num} · ${q.id}</span>
                <button class="link-btn" type="button" data-reopen="${q.id}">change</button></div>
              <div class="q-text">${esc(q.text)}</div>
              <div class="answer">→ ${esc(q.answer)}</div>
            </div>`;
        }
        const chips = q.choices.map(c => `<button class="chip" type="button" data-answer="${q.id}" data-value="${esc(c)}">${esc(c)}</button>`).join('');
        return `
          <div class="q open">
            <div class="q-top"><span class="q-num">${num} · ${q.id}</span></div>
            <div class="q-text">${esc(q.text)}</div>
            ${chips ? `<div class="chips">${chips}</div>` : ''}
            <input type="text" data-answer-input="${q.id}" placeholder="${chips ? 'or type an answer + enter' : 'type an answer + enter'}">
          </div>`;
      }).join('');
    }

    function renderDecisions() {
      document.getElementById('d-count').textContent = state.decisions.length;
      document.getElementById('decisions').innerHTML = state.decisions.map(d => `
        <div class="dec"><b><span class="item-id">${d.id}</span>${esc(d.text)}</b><span class="why">${esc(d.why)}</span></div>`).join('');
    }

    function renderFacts() {
      const el = document.getElementById('facts');
      if (!state.facts.length) { el.innerHTML = '<li class="empty">No facts pinned.</li>'; return; }
      el.innerHTML = state.facts.map(f => `
        <li>${esc(f.text)}<button class="dismiss" type="button" data-dismiss="${f.id}" title="Dismiss">×</button></li>`).join('');
    }

    function renderActivity() {
      document.getElementById('feed').innerHTML = state.activity.map(a => `
        <li class="${a.fresh ? 'fresh' : ''}"><span class="t">${a.ts}</span><span class="who who--${a.by}">${a.by}</span>${esc(a.text)}</li>`).join('');
      state.activity.forEach(a => { a.fresh = false; });
    }

    function inboxText() {
      if (!outbox.length) return 'Nothing queued. Claude is up to date.';
      const lines = outbox.map(e => `- ${e.label}`);
      return [`User notes from the page (since turn ${state.turn}):`, ...lines].join('\n');
    }

    function renderOutbox() {
      const stateEl = document.getElementById('outbox-state');
      stateEl.classList.toggle('clear', outbox.length === 0);
      stateEl.innerHTML = outbox.length
        ? `→ Claude on next prompt: <b>${outbox.length} queued</b>`
        : `→ Claude: <b>up to date</b>`;
      document.getElementById('deliver-btn').disabled = outbox.length === 0;
      document.getElementById('preview-text').textContent = inboxText();
      document.getElementById('preview').classList.toggle('open', previewOpen);
      document.getElementById('preview-btn').textContent = previewOpen ? 'hide preview' : 'preview';
    }

    function renderStatus() {
      document.getElementById('turn').textContent = `turn ${state.turn}`;
      const seconds = Math.round((Date.now() - state.updatedAt) / 1000);
      document.getElementById('updated').textContent = seconds < 2 ? 'updated just now' : `updated ${seconds}s ago`;
    }

    function renderDiagramTabs() {
      document.getElementById('diagram-tabs').innerHTML = state.diagrams.map(d =>
        `<button class="tab ${d.name === selectedDiagram ? 'selected' : ''}" type="button" data-diagram="${d.name}">${esc(d.name)}</button>`).join('');
    }

    function render() {
      renderPlan();
      renderQuestions();
      renderDecisions();
      renderFacts();
      renderActivity();
      renderOutbox();
      renderStatus();
      renderDiagramTabs();
    }

    function answerQuestion(id, value) {
      const question = state.questions.find(q => q.id === id);
      const answer = value.trim();
      if (!question || !answer) return;
      question.answer = answer;
      queueUserEvent({ t: 'question', op: 'answer', id, text: answer }, `answered ${id} "${question.text}" → ${answer}`);
    }

    // Event delegation for everything rendered from state
    document.addEventListener('click', e => {
      const planBtn = e.target.closest('[data-plan]');
      if (planBtn) {
        const item = state.plan.find(p => p.id === planBtn.dataset.plan);
        item.status = nextStatus[item.status];
        queueUserEvent({ t: 'plan', op: 'set', id: item.id, status: item.status }, `${item.id} → ${item.status}`);
        return;
      }
      const chip = e.target.closest('[data-answer]');
      if (chip) return answerQuestion(chip.dataset.answer, chip.dataset.value);
      const reopen = e.target.closest('[data-reopen]');
      if (reopen) {
        state.questions.find(q => q.id === reopen.dataset.reopen).answer = undefined;
        return render();
      }
      const dismiss = e.target.closest('[data-dismiss]');
      if (dismiss) {
        const fact = state.facts.find(f => f.id === dismiss.dataset.dismiss);
        state.facts = state.facts.filter(f => f !== fact);
        queueUserEvent({ t: 'fact', op: 'dismiss', id: fact.id }, `dismissed ${fact.id} "${fact.text}"`);
        return;
      }
      const tab = e.target.closest('[data-diagram]');
      if (tab) {
        selectedDiagram = tab.dataset.diagram;
        renderDiagramTabs();
        window.dispatchEvent(new Event('diagramchange'));
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const input = e.target.closest('[data-answer-input]');
      if (input) return answerQuestion(input.dataset.answerInput, input.value);
      if (e.target.id !== 'note-input' || !e.target.value.trim()) return;
      const text = e.target.value.trim();
      e.target.value = '';
      queueUserEvent({ t: 'note', op: 'add', text }, `note: ${text}`);
    });

    document.getElementById('preview-btn').addEventListener('click', () => {
      previewOpen = !previewOpen;
      renderOutbox();
    });

    // Simulates: you send a prompt → UserPromptSubmit hook delivers the inbox → Claude reacts → SSE update
    document.getElementById('deliver-btn').addEventListener('click', () => {
      const delivered = outbox.length;
      outbox.length = 0;
      state.turn += 1;
      state.activity.unshift({ ts: clock(), by: 'hook', text: `turn ${state.turn} · delivered ${delivered} event${delivered === 1 ? '' : 's'} to Claude`, fresh: true });
      state.updatedAt = Date.now();
      render();
      setTimeout(() => {
        const next = state.plan.find(p => p.status === 'todo');
        if (!next) return;
        state.plan.filter(p => p.status === 'active').forEach(p => { p.status = 'done'; });
        next.status = 'active';
        state.activity.unshift({ ts: clock(), by: 'claude', text: `${next.id} → active`, fresh: true });
        state.updatedAt = Date.now();
        render();
      }, 900);
    });

    // Theme
    const root = document.documentElement;
    window.currentTheme = () => root.dataset.theme
      || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.getElementById('theme-toggle').addEventListener('click', () => {
      root.dataset.theme = window.currentTheme() === 'dark' ? 'light' : 'dark';
      window.dispatchEvent(new Event('themechange'));
    });

    window.getSelectedDiagram = () => state.diagrams.find(d => d.name === selectedDiagram);
    setInterval(renderStatus, 1000);
    render();
  </script>

  <!-- Mermaid -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    const palettes = {
      dark: {
        primaryColor: '#0c2f48', primaryTextColor: '#d8e6f2', primaryBorderColor: '#38bdf8',
        lineColor: '#5f7d96', secondaryColor: '#0f1e2c', tertiaryColor: '#0c1925',
        background: '#0f1e2c', mainBkg: '#0c2f48', edgeLabelBackground: '#0f1e2c',
        actorBkg: '#0c2f48', actorBorder: '#38bdf8', actorTextColor: '#d8e6f2', actorLineColor: '#1f5a82',
        signalColor: '#8299ae', signalTextColor: '#d8e6f2',
      },
      light: {
        primaryColor: '#e0f2fe', primaryTextColor: '#0d1f2e', primaryBorderColor: '#0284c7',
        lineColor: '#7b93a8', secondaryColor: '#ffffff', tertiaryColor: '#f3f7fb',
        background: '#ffffff', mainBkg: '#e0f2fe', edgeLabelBackground: '#ffffff',
        actorBkg: '#e0f2fe', actorBorder: '#0284c7', actorTextColor: '#0d1f2e', actorLineColor: '#7cc4ee',
        signalColor: '#557087', signalTextColor: '#0d1f2e',
      },
    };
    const target = document.getElementById('diagram');
    let renderPass = 0;

    async function renderDiagram() {
      const pass = ++renderPass;
      const diagram = window.getSelectedDiagram();
      if (!diagram) return;
      mermaid.initialize({
        startOnLoad: false, theme: 'base', securityLevel: 'strict',
        fontFamily: "'Fragment Mono', ui-monospace, monospace",
        themeVariables: { ...palettes[window.currentTheme()], fontFamily: "'Fragment Mono', ui-monospace, monospace", fontSize: '13px' },
        flowchart: { curve: 'basis' },
        sequence: { mirrorActors: false },
      });
      try {
        const { svg } = await mermaid.render(`dgm-${pass}`, diagram.mermaid);
        if (pass === renderPass) target.innerHTML = svg;
      } catch (err) {
        target.innerHTML = `<span class="loading">Diagram failed to render: ${String(err.message || err)}</span>`;
      }
    }

    await document.fonts.ready;
    renderDiagram();
    window.addEventListener('themechange', renderDiagram);
    window.addEventListener('diagramchange', renderDiagram);
  </script>
